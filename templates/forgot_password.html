<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <title>Forgot Password</title>
</head>

<body>
    <div id="container">
        <div class="header-section text-center">
            <a class="navbar-brand" href="{{ url_for('home') }}" style="color: black;">
                <h3>A to Z Household Services</h3>
            </a>
        </div>
        <div id="panel">
            <div id="input-form">
                <h2>Forgot Password</h2>
                <form action="/forgot_password" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label"><b>Email</b></label>
                        <input type="email" class="form-control" name="email" id="email" required />
                    </div>
                    <div class="mb-3">
                        <label for="phone_no" class="form-label"><b>Phone Number</b></label>
                        <input type="tel" name="phone_no" class="form-control" id="phone_no" required />
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="container mt-2">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
        </div>
    </div>
</body>

</html>
