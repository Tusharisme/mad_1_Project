<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>Forgot Password</title>
</head>

<body>
    <div id="container">
        <div class="header-section text-center">
            <a class="navbar-brand" href="{{ url_for('home') }}" style="color: black;">
                <h3 style="text-decoration: underline;">A to Z Household Services</h3>
            </a>
        </div>
        <div id="panel">
            <div id="input-form">
                <h2 style="text-decoration: underline;">Forgot Password</h2>
                <form action="/forgot_password" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label" style="text-decoration: underline;"><b>Email</b></label>
                        <input type="email" class="form-control" name="email" id="email" required />
                    </div>
                    <div class="mb-3">
                        <label for="phone_no" class="form-label" style="text-decoration: underline;"><b>Phone Number</b></label>
                        <input type="tel" name="phone_no" class="form-control" id="phone_no" required />
                    </div>

                    <button type="submit" class="btn btn-custom">Submit</button>
                </form>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="container mt-2">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
        </div>
    </div>
    <!-- Add Font Awesome CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Footer -->
    <footer class="text-center py-3">
        <div class="container">
            <p>&copy; 2024 A to Z Household Services. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/tushar-jalan-2k5/" target="_blank" class="me-3">
                    <i class="fab fa-linkedin fa-lg"></i>
                </a>
                <a href="https://github.com/Tusharisme" target="_blank">
                    <i class="fab fa-github fa-lg"></i>
                </a>
            </div>
        </div>
    </footer>

</body>

</html>
