<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>Service Page</title>
</head>

<body>
    <div id="container">
        <div class="header-section text-center">
            <h3>A to Z Household Services</h3>
        </div>
        <div id="panel">
            <div id="input-form">
                <h2>New Service </h2>
                <form action="/service" method="POST">
                    <div class="mb-3">
                        <label for="service_name" class="form-label"><b> Service Name </b></label>
                        <input type="text" class="form-control" name="service_name" id="service_name"
                            aria-describedby="emailHelp" />
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label"><b>Description</b></label>
                        <input type="text" name="description" class="form-control" id="description" />
                    </div>
                    <div class="mb-3">
                        <label for="base_price" class="form-label"><b>Base Price</b></label>
                        <input type="text" class="form-control" name="base_price" id="base_price" />
                    </div>
                    {% if msg %}
                    <div class="alert alert-danger" role="alert">
                        <b>{{msg}}</b>
                    </div>
                    {% endif %}
                    <button type="submit" class="btn btn-success-custom">Add</button><br /><br />

                </form>
            </div>
        </div>
    </div>
    <!-- Add Font Awesome CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Footer -->
    <footer class="text-center py-3">
        <div class="container">
            <p>&copy; 2024 A to Z Household Services. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/tushar-jalan-2k5/" target="_blank" class="me-3">
                    <i class="fab fa-linkedin fa-lg"></i>
                </a>
                <a href="https://github.com/Tusharisme" target="_blank">
                    <i class="fab fa-github fa-lg"></i>
                </a>
            </div>
        </div>
    </footer>

</body>

</html>
