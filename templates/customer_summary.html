<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            /* Margin for spacing */
        }

        canvas {
            max-width: 400px;
            /* Max width for the charts */
            max-height: 400px;
            /* Increase max height for the charts */
            height: 400px;
            /* Set an explicit height */
        }
    </style>

</head>

<body>
    <div id="container">
        <div id="panel">
            <nav class="navbar navbar-expand-lg navbar-light  mb-4 sticky-top navbar-custom">
                <div class="container-fluid">
                    <label class="navbar-brand">Welcome {{ customer }}</label>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('customer_dashboard') }}">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('customer_summary') }}">Summary</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('customer_payments') }}">Payment</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('customer_profile') }}">Profile</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="{{ url_for('logout') }}">Logout</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <h2 style="text-decoration: underline;">Service Request Summary</h2>
            <br>
            <div class="chart-container">
                <canvas id="statusChart"></canvas>
            </div>

            <script>
                // Fetch data from the API
                fetch("{{ url_for('customer_summary_api') }}")
                    .then(response => response.json())
                    .then(data => {
                        const statusData = {
                            labels: data.status_data.labels,
                            datasets: [{
                                label: 'Service Status',
                                backgroundColor: [
                                    'rgba(54, 162, 235, 0.6)', // Blue for accepted
                                    'rgba(255, 99, 132, 0.6)', // Red for rejected
                                    'rgba(255, 206, 86, 0.6)', // Yellow for completed
                                    'rgba(75, 192, 192, 0.6)'  // Green for requested
                                ],
                                data: data.status_data.values,
                            }]
                        };

                        const ctx = document.getElementById('statusChart').getContext('2d');
                        new Chart(ctx, {
                            type: 'bar',
                            data: statusData,
                            options: {
                                responsive: true,
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: {
                                            stepSize: 1, // Set a step size for Y-axis ticks
                                        }
                                    },
                                    x: {
                                        grid: {
                                            display: false // Optionally hide the grid on the X-axis
                                        }
                                    }
                                }
                            }
                        });
                    })
                    .catch(error => console.error('Error fetching data:', error));
            </script>

        </div>
    </div>
    <!-- Add Font Awesome CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Footer -->
    <footer class="text-center py-3">
        <div class="container">
            <p>&copy; 2024 A to Z Household Services. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/tushar-jalan-2k5/" target="_blank" class="me-3">
                    <i class="fab fa-linkedin fa-lg"></i>
                </a>
                <a href="https://github.com/Tusharisme" target="_blank">
                    <i class="fab fa-github fa-lg"></i>
                </a>
            </div>
        </div>
    </footer>

</body>

</html>
