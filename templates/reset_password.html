<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <title>Reset Password</title>
</head>

<body>
  <div id="container">
    <div class="header-section text-center">
      <a class="navbar-brand" href="{{ url_for('home') }}" style="color: black;">
        <h3>A to Z Household Services</h3>
      </a>
    </div>
    <div id="panel">
      <div id="input-form">
        <h2>Reset Password</h2>
        <!-- Use url_for to ensure correct route -->
        <form action="{{ url_for('reset_password', user_id=user_id) }}" method="POST">
          <div class="mb-3">
            <label for="new_password" class="form-label"><b>New Password</b></label>
            <input type="number" class="form-control" name="new_password" id="new_password" required />
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label"><b>Confirm Password</b></label>
            <input type="number" class="form-control" name="confirm_password" id="confirm_password" required />
          </div>
          <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="container mt-2">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}
    </div>
  </div>
</body>

</html>
