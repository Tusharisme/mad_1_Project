<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <!--calling external styles-->
    <!--third party bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title>Login Page</title>
  </head>

  <body>
    <div id="container">
      <div class="header-section text-center">
        <a class="navbar-brand" href="{{ url_for('home') }}" style="color: black;"><h3>A to Z Household Services</h3></a>
      </div>
      <div id="panel">
        <div id="input-form">
          <h2>Login</h2>
          <form action="/login" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label"
                ><b> Registered Email ID </b></label
              >
              <input
                type="email"
                class="form-control"
                name="email"
                id="email"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="pwd" class="form-label"><b>Password</b></label>
              <input type="password" name="pwd" class="form-control" id="pwd" />
            </div>
            <button type="submit" class="btn btn-success">Login</button
            ><br /><br />
            <a href="/signup" class="btn btn-link"><b>Create Account?</b></a>
            <br />
          </form>

          <!-- Only show this if there is a message (e.g. for wrong credentials) -->
          {% if msg %}
          <div class="alert alert-danger" role="alert">
            <b>{{msg}}</b>
          </div>
          {% endif %}
        </div>

        <br /><br />
        <a href="/register" class="btn btn-link"
          ><b>Register as Professional</b></a
        >
      </div>
    </div>
  </body>
</html>
