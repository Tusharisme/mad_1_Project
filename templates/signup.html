<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>Signup Page</title>
</head>

<body>
    <div id="container">
        <div class="header-section text-center">
            <a class="navbar-brand" href="{{ url_for('home') }}" style="color: black;">
                <h3 style="text-decoration: underline;">A to Z Household Services</h3>
            </a>
        </div>
        <div id="panel">
            <div id="input-form">
                <h2 style="text-decoration: underline;">Customer Signup</h2>
                <br>
                <form action="/signup" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label" style="text-decoration: underline;"><b>User
                                Name</b></label>
                        <input type="text" class="form-control" id="username" name="uname" aria-describedby="userHelp"
                            required />
                    </div>
                    <div class="mb-3">
                        <label for="pwd" class="form-label" style="text-decoration: underline;"><b>Password</b></label>
                        <input type="password" class="form-control" id="pwd" name="pwd" required />
                    </div>
                    <div class="mb-3">
                        <label for="fullname" class="form-label" style="text-decoration: underline;"><b>Full
                                Name</b></label>
                        <input type="text" name="full_name" class="form-control" id="fullname" required />
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label" style="text-decoration: underline;"><b>Email</b></label>
                        <input type="email" class="form-control" name="email" id="email" aria-describedby="emailHelp"
                            required />
                    </div>
                    <div class="mb-3">
                        <label for="phone_no" class="form-label" style="text-decoration: underline;"><b>Phone
                                No.:</b></label>
                        <input type="text" class="form-control" name="phone_no" id="phone_no" required />
                    </div>
                    <div class="mb-3">
                        <label for="gender" class="form-label"
                            style="text-decoration: underline;"><b>Gender:</b></label>
                        <select class="form-select" name="gender" id="gender">
                            <option value="" selected disabled>Select your gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label"
                            style="text-decoration: underline;"><b>Address</b></label>
                        <input type="text" class="form-control" name="address" id="address" required />
                    </div>
                    <div class="mb-3">
                        <label for="pin_code" class="form-label" style="text-decoration: underline;"><b>Pin
                                Code:</b></label>
                        <input type="text" class="form-control" name="pin_code" id="pin_code" required />
                    </div>

                    <button type="submit" class="btn btn-success-custom">Register</button><br /><br />
                    {% if msg %}
                    <div class="alert alert-danger" role="alert">
                        <b>{{msg}}</b>
                    </div>
                    {% endif %}
                    <a href="/login" class="btn btn-link"><b>Login here</b></a>
                </form>
            </div>
        </div>
    </div>
    <!-- Add Font Awesome CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Footer -->
    <footer class="text-center py-3">
        <div class="container">
            <p>&copy; 2024 A to Z Household Services. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/tushar-jalan-2k5/" target="_blank" class="me-3">
                    <i class="fab fa-linkedin fa-lg"></i>
                </a>
                <a href="https://github.com/Tusharisme" target="_blank">
                    <i class="fab fa-github fa-lg"></i>
                </a>
            </div>
        </div>
    </footer>

</body>

</html>
