<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/style.css" />
  <!--calling external styles -->
  <!--third party bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <title>Professional Signup Page</title>
</head>

<body>
  <div id="container">
    <div class="header-section text-center">
      <a class="navbar-brand" href="{{ url_for('home') }}" style="color: black;">
        <h3>A to Z Household Services</h3>
      </a>
    </div>
    <div id="panel">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="container mt-2">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}
      <div id="input-form">
        <h2>Service Professional Signup</h2>
        <form action="/register" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="username" class="form-label"><b>User Name</b></label>
            <input type="text" class="form-control" id="username" name="uname" aria-describedby="userHelp" required />
          </div>
          <div class="mb-3">
            <label for="pwd" class="form-label"><b>Password</b></label>
            <input type="password" class="form-control" id="pwd" name="pwd" required />
          </div>
          <div class="mb-3">
            <label for="fullname" class="form-label"><b>Full Name</b></label>
            <input type="text" name="full_name" class="form-control" id="fullname" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label"><b>Email</b></label>
            <input type="email" class="form-control" name="email" id="email" aria-describedby="emailHelp" required />
          </div>
          <div class="mb-3">
            <label for="phone_no" class="form-label"><b>Phone No.:</b></label>
            <input type="text" class="form-control" name="phone_no" id="phone_no" required />
          </div>
          <div class="mb-3">
            <label for="gender" class="form-label"><b>Gender:</b></label>
            <select class="form-select" name="gender" id="gender" required>
              <option value="" selected disabled>Select your gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="experience" class="form-label"><b>Experience (in years)</b></label>
            <input type="text" class="form-control" name="experience" id="experience" required />
          </div>
          <div class="mb-3">
            <label for="document" class="form-label"><b>Attach Documents (Single PDF)</b></label>
            <input type="file" class="form-control form-control-sm" name="document" id="document" required />
          </div>
          <div class="mb-3">
            <label for="address" class="form-label"><b>Address</b></label>
            <input type="text" class="form-control" name="address" id="address" required />
          </div>
          <div class="mb-3">
            <label for="pin_code" class="form-label"><b>Pin Code:</b></label>
            <input type="text" class="form-control" name="pin_code" id="pin_code" required />
          </div>

          <!-- New Section for Selecting Service Type -->
          <div class="mb-3">
            <label for="service_ids" class="form-label"><b>Select Service Type</b></label>
            <select class="form-select" id="service_ids" name="service_type" required>
              {% for service in available_services %}
              <option value="{{ service.name }}">{{ service.name }}</option>
              {% endfor %}
            </select>
          </div>

          <button type="submit" class="btn btn-success">Register</button><br /><br />

          <!-- Only show this if there is a message  -->
          {% if msg %}
          <div class="alert alert-danger" role="alert">
            <b>{{ msg }}</b>
          </div>
          {% endif %}
      </div>
      <a href="/login" class="btn btn-link"><b>Login here</b></a>
      </form>
    </div>
  </div>
  </div>
</body>

</html>
