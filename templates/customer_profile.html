<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Profile</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>

<body>
    <div id="container">
        <div id="panel">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <label>Welcome {{ customer.username }}</label>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('customer_dashboard') }}">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('customer_summary') }}">Summary</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('customer_profile') }}">Profile</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="{{ url_for('logout') }}">Logout</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Flash Messages Section -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="container">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}


            <!-- Profile Information Section -->
            <h2>Customer Profile</h2>


            <form method="POST" enctype="multipart/form-data" action="{{ url_for('update_customer_profile') }}">
                <!-- Profile Picture -->
                <div class="mb-3">
                    <label for="profile_pic"><img src="{{ customer.profile_pic }}" alt="Profile Picture" width="150"
                            height="150" class="rounded-circle" /></label><br><br>
                    <label for="profile_pic" class="form-label"><b><i>Edit</i></b></label><br>
                    <input type="file" class="form-control" id="profile_pic" name="profile_pic" hidden />
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ customer.name }}"
                        required />
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                        value="{{ customer.username }}" required />
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ customer.email }}"
                        required />
                </div>
                <div class="mb-3">
                    <label for="phone_no" class="form-label">Phone No.</label>
                    <input type="text" class="form-control" id="phone_no" name="phone_no"
                        value="{{ customer.phone_no }}" required />
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" name="address" value="{{ customer.address }}"
                        required />
                </div>

                <div class="mb-3">
                    <label for="pin_code" class="form-label">Pin Code</label>
                    <input type="text" class="form-control" id="pin_code" name="pin_code"
                        value="{{ customer.pin_code }}" required />
                </div>
                <!-- Gender Dropdown -->
                <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="Male" {% if customer.gender=="Male" %}selected{% endif %}>Male</option>
                        <option value="Female" {% if customer.gender=="Female" %}selected{% endif %}>Female</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </div>
</body>

</html>
