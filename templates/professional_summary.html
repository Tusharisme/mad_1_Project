<!-- Professional Summary -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        .chart-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            /* Margin for spacing */
        }

        canvas {
            max-width: 400px;
            /* Max width for the charts */
            max-height: 400px;
            /* Increase max height for the charts */
            height: 400px;
            /* Set an explicit height */
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="panel">
            <nav class="navbar navbar-expand-lg navbar-light  mb-4 sticky-top navbar-custom ">
                <div class="container-fluid">
                    <label class="navbar-brand">Welcome {{ professional }}</label>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('professional_dashboard') }}">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('professional_summary') }}">Summary</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('professional_payments') }}">Payment</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('professional_profile') }}">Profile</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="{{ url_for('logout') }}">Logout</a>
                            </li>
                        </ul>
                        <form class="d-flex" action="{{ url_for('search_service') }}" method="GET">
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
                                name="query" />
                            <button class="btn btn-outline-success" type="submit">
                                Search
                            </button>
                        </form>
                    </div>
                </div>
            </nav>

            <div class="container mt-4">
                <h3 style="text-decoration: underline;">Service Summary</h3>

                <!-- Chart Container -->
                <div class="chart-container">
                    <!-- Ratings Chart -->
                    <div>
                        <h4 style="text-decoration: underline;">Ratings</h4>
                        <canvas id="ratingsChart"></canvas>
                    </div>

                    <!-- Service Status Chart -->
                    <div>
                        <h4 style="text-decoration: underline;">Service Status</h4>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Fetch data from the API for Ratings and Status
        fetch("{{ url_for('professional_summary_api') }}")
            .then(response => response.json())
            .then(data => {
                // Set up Ratings Chart
                const ratingsChartCtx = document.getElementById('ratingsChart').getContext('2d');
                const ratingsChart = new Chart(ratingsChartCtx, {
                    type: 'bar',
                    data: {
                        labels: data.ratings_data.labels,
                        datasets: [{
                            label: 'Number of Ratings',
                            data: data.ratings_data.values,
                            backgroundColor: 'rgba(75, 192, 192, 0.6)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1,
                            barThickness: 100 // Adjust this value to make bars thinner or thicker
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1, // Set a step size for Y-axis ticks
                                    max: Math.max(...data.ratings_data.values) + 5 // Increase max value by 5 for better visualization
                                }
                            },
                            x: {
                                grid: {
                                    display: false // Optionally hide the grid on the X-axis
                                }
                            }
                        },
                        responsive: true,
                        maintainAspectRatio: false // Allow the chart to be responsive
                    }
                });

                // Set up Service Status Chart
                const statusChartCtx = document.getElementById('statusChart').getContext('2d');
                const statusChart = new Chart(statusChartCtx, {
                    type: 'pie',
                    data: {
                        labels: data.status_data.labels,
                        datasets: [{
                            label: 'Service Status',
                            data: data.status_data.values,
                            backgroundColor: [
                                'rgba(255, 99, 132, 0.6)', // Red for requested
                                'rgba(54, 162, 235, 0.6)', // Blue for accepted
                                'rgba(255, 206, 86, 0.6)', // Yellow for rejected
                                'rgba(153, 102, 255, 0.6)', // Purple for completed
                            ],
                            borderColor: [
                                'rgba(255, 99, 132, 1)', // Red for requested
                                'rgba(54, 162, 235, 1)', // Blue for accepted
                                'rgba(255, 206, 86, 1)', // Yellow for rejected
                                'rgba(153, 102, 255, 1)', // Purple for completed
                            ],

                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                    }
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>
    <!-- Add Font Awesome CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Footer -->
    <footer class="text-center py-3">
        <div class="container">
            <p>&copy; 2024 A to Z Household Services. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/tushar-jalan-2k5/" target="_blank" class="me-3">
                    <i class="fab fa-linkedin fa-lg"></i>
                </a>
                <a href="https://github.com/Tusharisme" target="_blank">
                    <i class="fab fa-github fa-lg"></i>
                </a>
            </div>
        </div>
    </footer>

</body>

</html>
