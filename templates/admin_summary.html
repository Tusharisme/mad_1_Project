<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .chart-container {
            display: flex;
            justify-content: space-around;
            /* Space around the charts to display them side by side */
            margin: 10px 5px;
        }

        canvas {
            max-width: auto;
            max-height: auto;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="panel">
            <nav class="navbar navbar-expand-lg navbar-light  mb-4 sticky-top navbar-custom ">
                <div class="container-fluid">
                    <label class="navbar-brand">Welcome {{ admin }}</label>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('admin_dashboard') }}">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="{{ url_for('admin_summary') }}">Summary</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="{{ url_for('logout') }}">Log
                                    Out</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <h2 style="text-decoration: underline;">Admin Summary</h2>

            <!-- Service Request Summary Chart -->
            <div class="chart-container">
                <div>
                    <h4 style="text-decoration: underline;">Service Request Summary</h4>
                    <canvas id="serviceRequestChart" width="400" height="400"></canvas>
                </div>

                <!-- Customer Rating Summary Chart -->
                <div>
                    <h4 style="text-decoration: underline;">Customer Rating Summary</h4>
                    <canvas id="customerRatingChart" width="400" height="400"></canvas>
                </div>
            </div>

            <script>
                // Fetch data for both charts
                fetch("{{ url_for('admin_summary_api') }}")
                    .then(response => response.json())
                    .then(data => {
                        // Service Request Summary (Bar chart)
                        const serviceRequestData = {
                            labels: data.service_request_summary.labels,
                            datasets: [{
                                label: 'Service Request Status',
                                backgroundColor: [
                                    'rgba(54, 162, 235, 0.6)', // Blue
                                    'rgba(255, 99, 132, 0.6)', // Red
                                    'rgba(255, 206, 86, 0.6)', // Yellow
                                    'rgba(75, 192, 192, 0.6)', // Green
                                ],
                                data: data.service_request_summary.data,
                            }]
                        };

                        const ctx1 = document.getElementById('serviceRequestChart').getContext('2d');
                        new Chart(ctx1, {
                            type: 'bar',
                            data: serviceRequestData,
                            options: {
                                responsive: true,
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: {
                                            stepSize: 1, // Set a step size for Y-axis ticks
                                        }
                                    },
                                    x: {
                                        grid: {
                                            display: false // Optionally hide the grid on the X-axis
                                        }
                                    }
                                }
                            }
                        });

                        // Customer Rating Summary (Pie chart)
                        const customerRatingData = {
                            labels: data.customer_ratings.labels,
                            datasets: [{
                                label: 'Customer Ratings',
                                backgroundColor: [
                                    'rgba(255, 99, 132, 0.6)', // Red
                                    'rgba(54, 162, 235, 0.6)', // Blue
                                    'rgba(255, 206, 86, 0.6)', // Yellow
                                    'rgba(75, 192, 192, 0.6)', // Green
                                    'rgba(153, 102, 255, 0.6)', // Purple
                                ],
                                data: data.customer_ratings.data,
                            }]
                        };

                        const ctx2 = document.getElementById('customerRatingChart').getContext('2d');
                        new Chart(ctx2, {
                            type: 'pie',
                            data: customerRatingData,
                            options: {
                                responsive: true,
                            }
                        });
                    })
                    .catch(error => console.error('Error fetching data:', error));
            </script>

        </div>
    </div>
    <!-- Add Font Awesome CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Footer -->
    <footer class="text-center py-3">
        <div class="container">
            <p>&copy; 2024 A to Z Household Services. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/tushar-jalan-2k5/" target="_blank" class="me-3">
                    <i class="fab fa-linkedin fa-lg"></i>
                </a>
                <a href="https://github.com/Tusharisme" target="_blank">
                    <i class="fab fa-github fa-lg"></i>
                </a>
            </div>
        </div>
    </footer>

</body>

</html>
