<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>Search Results</title>
</head>

<body>
    <div class="container-fluid">
        <h3>{{ category }}</h3>
        <div class="row">
            {% for service in services %}
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ service.name }}</h5>
                        <p class="card-text">Price: ${{ service.base_price }}</p>
                        <a href="{{ url_for('get_service_professionals', service_id=service.id) }}"
                            class="btn btn-primary">View Professionals</a>
                    </div>
                </div>
            </div>
            {% else %}
            <p>No services found matching your query.</p>
            {% endfor %}
        </div>
        <a href="{{ url_for('customer_dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </div>
</body>

</html>
